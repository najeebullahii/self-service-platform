apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: storagebuckets.platform.example.org
spec:
  scope: Namespaced
  group: platform.example.org
  names:
    kind: StorageBucket
    plural: storagebuckets
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                team:
                  type: string
                  enum: [payments, orders, platform]
                  description: The team that owns this storage. Used for tagging.
              required:
                - team
