apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-requests
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/najeebullahii/platform-gitops.git
    targetRevision: main
    path: requests
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
